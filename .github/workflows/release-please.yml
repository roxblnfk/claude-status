name: Release Please

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

      # The Vibe Index badge rides along in the release pull request instead of
      # landing on the default branch by itself: one badge commit per release
      # rather than one per push, and the figure is reviewable before it ships.
      # Checking the pull request branch out is what puts the commit there —
      # the action pushes to whatever HEAD points at.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          # The score is read from the commit history; a shallow clone would
          # score whatever slice of it the runner happened to fetch.
          fetch-depth: 0
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}

      # release-please raises the version in Cargo.toml through the annotation
      # there and knows nothing about Cargo.lock, which pins the workspace
      # crates by version as well. Left alone it trails a release behind, and
      # then the first build on any machine rewrites it — a file that is always
      # dirty and never committed. Cargo brings it in line itself; doing it in
      # the release pull request keeps the two in step without a commit of its
      # own on the default branch.
      - name: Bring Cargo.lock to the released version
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet || git commit -m "chore: sync Cargo.lock with the release version"
          git push

      - uses: roxblnfk/action-vibe-index@v1
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          update-files: README.md,README.ru.md
          commit: true
          push: true

  binaries:
    name: Build binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
