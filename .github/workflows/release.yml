name: Release binaries

on:
  # Called by release-please.yml right after it publishes a release.
  workflow_call:
    inputs:
      tag:
        description: Tag of the release to attach the binaries to.
        required: true
        type: string
  # Manual re-run, e.g. after a failed build. The release must already exist.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to attach the binaries to.
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # 22.04 keeps the binary usable on distributions with an older glibc.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Cross-compiled from the Apple Silicon runner: the Intel ones are
          # being retired and a job asking for one sits in the queue forever.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="claude-status-${{ inputs.tag }}-${{ matrix.target }}"
          src="target/${{ matrix.target }}/release"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$src/claude-status.exe" "dist/$name/"
          else
            cp "$src/claude-status" "dist/$name/"
          fi
          cp README.md README.ru.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="$name.zip"
            7z a "$archive" "$name" > /dev/null
          else
            archive="$name.tar.gz"
            tar czf "$archive" "$name"
          fi
          # macOS has shasum, the other two have sha256sum.
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber
