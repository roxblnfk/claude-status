cli:
  help:
    en: |-
      claude-status — Claude Code usage limit monitor

      Usage:
        claude-status                       launch the window and tray icon
        claude-status install [--interval N] [--force]
                                            register the hook in ~/.claude/settings.json
        claude-status uninstall             remove the hook from the settings
        claude-status status                show the registration state and the latest sample
        claude-status preview [template]    print the status line
        claude-status --help                this help

      install options:
        --interval N   re-run the command every N seconds (default 60)
        --force        replace a third-party statusLine command, preserving it

      Environment variables:
        CLAUDE_CONFIG_DIR    Claude Code directory instead of ~/.claude
        CLAUDE_STATUS_DIR    directory holding the database and the configuration
        CLAUDE_STATUS_DUMP   file the hook appends raw Claude Code JSON to
        CLAUDE_STATUS_LANG   interface language: en, ru or auto
        CLAUDE_STATUS_DEBUG  print hook errors to stderr
    ru: |-
      claude-status — наблюдение за лимитами Claude Code

      Использование:
        claude-status                       запустить окно и иконку в трее
        claude-status install [--interval N] [--force]
                                            прописать хук в ~/.claude/settings.json
        claude-status uninstall             убрать хук из настроек
        claude-status status                показать состояние прописки и последний снимок
        claude-status preview [шаблон]      напечатать статусную строку
        claude-status --help                эта справка

      Ключи install:
        --interval N   перезапускать команду каждые N секунд (по умолчанию 60)
        --force        заменить чужую команду statusLine, сохранив её

      Переменные окружения:
        CLAUDE_CONFIG_DIR    каталог Claude Code вместо ~/.claude
        CLAUDE_STATUS_DIR    каталог с базой и конфигом
        CLAUDE_STATUS_DUMP   файл, куда хук дописывает сырой JSON от Claude Code
        CLAUDE_STATUS_LANG   язык интерфейса: en, ru или auto
        CLAUDE_STATUS_DEBUG  печатать ошибки хука в stderr
