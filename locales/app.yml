        The figures below are counted from the session logs. Claude Code deletes
        old ones, so the history starts where the oldest log still on disk does —
        and grows from here, because what has been counted stays counted.
      ru: >-
        Цифры ниже посчитаны по логам сессий. Claude Code удаляет старые, поэтому
        история начинается с самого раннего сохранившегося лога — и дальше только
        растёт: посчитанное остаётся посчитанным.
    last_scan:
      en: Last counted
      ru: Последний подсчёт
    never:
