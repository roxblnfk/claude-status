cli:
  help:
    en: |-
      claude-status — Claude Code usage limit monitor

      Usage:
        claude-status                       launch the window and tray icon
        claude-status --tray                launch into the tray without a window
        claude-status install [--interval N] [--force]
                                            register the hook in ~/.claude/settings.json
        claude-status uninstall             remove the hook from the settings
        claude-status status                show the registration state and the latest sample
        claude-status preview [template]    print the status line
        claude-status probe                 ask Claude Code for the limits and store them
        claude-status scan                  count tokens from the session logs
        claude-status models                show which models Claude Code is pinned to
        claude-status models set SLOT MODEL point a slot at a model
        claude-status models clear SLOT|--all
                                            remove an override, or all of them
        claude-status update                fetch a newer release from GitHub, if any
        claude-status hook                  read one status line payload from stdin
                                            (what Claude Code runs; not for hand use)
        claude-status --help                this help

      install options:
        --interval N   re-run the command every N seconds (default 60)
        --force        replace a third-party statusLine command, preserving it

      models slots:
        default        the model a session starts on (settings.json "model")
        opus           what the opus alias resolves to
        sonnet         what the sonnet alias resolves to
        haiku          what the haiku alias resolves to
        subagent       what subagents run on
      A model is anything Claude Code accepts: an alias (opus), an id
      (claude-opus-4-8), either with a [1m] suffix for the 1M-token context.
      Nothing is verified here — Claude Code alone knows what your plan may run.

      Environment variables:
        CLAUDE_CONFIG_DIR    Claude Code directory instead of ~/.claude
        CLAUDE_STATUS_DIR    directory holding the database and the configuration
        CLAUDE_STATUS_DUMP   file the hook appends raw Claude Code JSON to
        CLAUDE_STATUS_LANG   interface language: en, ru or auto
        CLAUDE_STATUS_DEBUG  print hook errors to stderr
        CLAUDE_STATUS_CLAUDE_BIN  Claude Code executable used by the probe
    ru: |-
      claude-status — наблюдение за лимитами Claude Code

      Использование:
        claude-status                       запустить окно и иконку в трее
        claude-status --tray                запустить сразу в трей, без окна
        claude-status install [--interval N] [--force]
                                            прописать хук в ~/.claude/settings.json
        claude-status uninstall             убрать хук из настроек
        claude-status status                показать состояние прописки и последний снимок
        claude-status preview [шаблон]      напечатать статусную строку
        claude-status probe                 спросить лимиты у Claude Code и сохранить
        claude-status scan                  посчитать токены по логам сессий
        claude-status models                показать, на каких моделях закреплён Claude Code
        claude-status models set СЛОТ МОДЕЛЬ направить слот на модель
        claude-status models clear СЛОТ|--all
                                            убрать переопределение или все сразу
        claude-status update                скачать с GitHub новую версию, если она есть
        claude-status hook                  прочитать одну порцию данных со stdin
                                            (это запускает Claude Code, руками не нужно)
        claude-status --help                эта справка

      Ключи install:
        --interval N   перезапускать команду каждые N секунд (по умолчанию 60)
        --force        заменить чужую команду statusLine, сохранив её

      Слоты models:
        default        модель, с которой начинается сессия (ключ "model")
        opus           во что разворачивается алиас opus
        sonnet         во что разворачивается алиас sonnet
        haiku          во что разворачивается алиас haiku
        subagent       на чём работают сабагенты
      Модель — это любое имя, которое принимает Claude Code: алиас (opus), id
      (claude-opus-4-8), с суффиксом [1m] для миллионного контекста. Здесь
      ничего не проверяется — что доступно подписке, знает только Claude Code.

      Переменные окружения:
        CLAUDE_CONFIG_DIR    каталог Claude Code вместо ~/.claude
        CLAUDE_STATUS_DIR    каталог с базой и конфигом
        CLAUDE_STATUS_DUMP   файл, куда хук дописывает сырой JSON от Claude Code
        CLAUDE_STATUS_LANG   язык интерфейса: en, ru или auto
        CLAUDE_STATUS_DEBUG  печатать ошибки хука в stderr
        CLAUDE_STATUS_CLAUDE_BIN  исполняемый файл Claude Code для запроса
