      Засечка показывает, сколько прошло самого окна: %{elapsed} из %{total},
      это %{pct}%. Заполнение до неё — расход медленнее хода часов.
  even_pace:
    en: "Even pace by now: %{pct}%"
    ru: "По графику сейчас: %{pct}%"
  even_pace_hint:
    en: >-
      The even pace spreads the weekly limit equally over all seven days. By now
      it allows %{expected}%; %{used}% has been spent.
    ru: >-
      Равномерный график растягивает недельный лимит поровну на все семь дней. К
      этому моменту он допускает %{expected}%, а потрачено %{used}%.
  verdict:
    ahead:
      en: "%{time} ahead of schedule"
      ru: "опережаете график на %{time}"
    behind:
      en: "%{time} behind schedule — that is spare limit"
      ru: "отстаёте от графика на %{time} — это запас"
    on_track:
      en: on schedule
      ru: идёте по графику
  budget:
    title:
      en: Recommendation
      ru: Рекомендация
    remaining:
      en: Limit remaining
      ru: Осталось лимита
    per_day:
      en: Average per day
      ru: В среднем в сутки
    per_day_hint:
      en: >-
        The limit left right now, divided by the time left. Recomputed with
        every reading, so it rises when a day comes in under budget. Today's
        ration in the row below is the same division made at midnight and then
        held for the day — the two are meant to differ.
      ru: >-
        Остаток лимита на сейчас, делённый на оставшееся время. Пересчитывается
        с каждым снимком, поэтому растёт, когда день прошёл экономно. Норма на
        сегодня в строке ниже — то же деление, но сделанное в полночь и
        зафиксированное на день; они и должны расходиться.
    per_day_value:
      en: "%{pct}% — to land exactly within the remaining %{left}"
      ru: "%{pct}% — чтобы ровно уложиться в оставшиеся %{left}"
    today:
      en: Today
      ru: Сегодня
    today_hint:
      en: >-
        Counted from the level the week stood at at midnight. The ration is set
        once for the day and does not move as it is being spent — this is what
        the inner ring of the tray icon shows.
      ru: >-
        Считается от уровня, на котором неделя стояла в полночь. Норма
        назначается на день один раз и не уползает по мере трат — именно её
        показывает внутреннее кольцо иконки в трее.
    today_value:
      en: "%{spent}% of %{allowance}% — %{left}% left"
      ru: "%{spent}% из %{allowance}% — осталось %{left}%"
    today_estimated:
      en: >-
        Collecting started later than this week did, so the level at midnight is
        an estimate: the usage seen at the first reading, spread evenly back
        over the week.
      ru: >-
        Сбор данных начался позже, чем эта неделя, поэтому уровень на полночь
        оценён: расход из первого снимка, равномерно разложенный назад по
        неделе.
    pace:
      en: Average spending
      ru: Расход в среднем
    pace_hint:
      en: >-
        The average over %{span} of observation — from the first reading of this
        week to the latest one. Pauses count in, so a short burst does not turn
        into a frightening forecast.
      ru: >-
        Среднее за %{span} наблюдений — от первого снимка этой недели до
        последнего. Паузы входят в счёт, поэтому короткий всплеск не
        превращается в пугающий прогноз.
    pace_value:
      en: "%{burn}% a day — %{projected}% of the limit spent by the reset"
      ru: "%{burn}% в сутки — к сбросу уйдёт %{projected}% лимита"
    pace_over:
      en: "%{burn}% a day — at this rate the limit runs out before the reset"
      ru: "%{burn}% в сутки — при такой скорости лимит кончится раньше сброса"
    pace_unknown:
      en: not enough data yet
      ru: данных пока мало
    advice:
      slow_down:
        en: >-
          Ease off: at the current rate the limit runs out on %{time}. Staying
          under %{pct}% a day makes it last until the reset.
        ru: >-
          Стоит сбавить: при текущей скорости лимит кончится %{time}. Чтобы его
          хватило до сброса, держитесь не более %{pct}% в сутки.
      today_done:
        en: >-
          Today's ration of %{allowance}% is used up. The week still holds, but
          it is worth stopping until midnight.
        ru: >-
          Норма на сегодня — %{allowance}% — израсходована. До сброса лимита
          хватает, но лучше остановиться до полуночи.
      ahead:
        en: >-
          You are ahead of the even pace, but the limit still holds. Today's
          ration is %{allowance}%, with %{left}% of it still free.
        ru: >-
          Вы опережаете равномерный график, но лимита пока хватает. Норма на
          сегодня — %{allowance}%, из неё свободно ещё %{left}%.
      on_track:
        en: >-
          On track. Today's ration is %{allowance}%, with %{left}% of it still
          free.
        ru: >-
          Всё в порядке. Норма на сегодня — %{allowance}%, из неё свободно ещё
          %{left}%.
    exhausted:
      en: Limit runs out
      ru: Лимит кончится
    exhausted_value:
      en: "%{time} (%{left} before the reset)"
      ru: "%{time} (за %{left} до сброса)"
  freshness:
    en: "Updated %{age} ago"
    ru: "Обновлено %{age} назад"
  freshness_stale:
    en: "Updated %{age} ago — Claude Code does not seem to be running"
    ru: "Обновлено %{age} назад — Claude Code, похоже, не запущен"
  freshness_repeating:
    en: >-
      Claude Code is repeating figures from a window that has already closed —
      it refreshes them only when a session receives a reply. They will catch up
      after the next message in a session where the status line is shown.
    ru: >-
      Claude Code повторяет цифры из окна, которое уже закрылось: он обновляет
      их только когда сессия получает ответ. Данные догонят реальность после
      очередного сообщения в сессии, где отображается статусная строка.

history:
