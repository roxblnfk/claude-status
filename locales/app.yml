settings:
  page:
    source:
      en: Data source
      ru: Источник данных
    models:
      en: Models
      ru: Модели
    statusline:
      en: Status line
      ru: Статусная строка
    program:
      en: Program
      ru: Приложение
    update:
      en: Update
      ru: Обновление
  hook:
    title:
      en: Claude Code hook
      ru: Хук в Claude Code
    explanation:
      en: >-
        Claude Status reads your usage from the Claude Code status line.
        Register the hook to start collecting, then restart your Claude Code
        sessions.
      ru: >-
        Claude Status берёт данные о расходе из статусной строки Claude Code.
        Пропишите хук, чтобы начать сбор, и перезапустите сессии Claude Code.
    state_ours:
      en: Registered
      ru: Установлен
    state_stale:
      en: Registered, but pointing at another file
      ru: Установлен, но ведёт на другой файл
    state_stale_note:
      en: >-
        Earlier releases shipped a second binary for the hook; the download is
        one file now. Register again to point the setting at it.
      ru: >-
        Раньше хук был отдельным бинарником, теперь в архиве один файл.
        Нажмите «Прописать», чтобы настройка вела на него.
    state_foreign:
      en: A third-party command is registered
      ru: Прописана сторонняя команда
    state_foreign_note:
      en: Your command will be saved and put back if you remove Claude Status later.
      ru: Ваша команда сохранится и вернётся, если позже убрать Claude Status.
    state_absent:
      en: Not registered — no data is being collected
      ru: Не установлен — данные не собираются
    interval:
      en: Refresh every
      ru: Обновлять каждые
    interval_hint:
      en: (keeps the numbers current while you are not typing)
      ru: (обновляет цифры, пока вы не работаете в сессии)
    register:
      en: Register in Claude Code
      ru: Прописать в Claude Code
    replace:
      en: Replace and register
      ru: Заменить и прописать
    remove:
      en: Remove
      ru: Убрать
    applied_note:
      en: Restart your Claude Code sessions for changes to take effect.
      ru: Перезапустите сессии Claude Code, чтобы изменения вступили в силу.
    registered_at:
      en: "Registered %{path}"
      ru: "Прописан %{path}"
    removed:
      en: The hook has been removed from the Claude Code settings
      ru: Хук убран из настроек Claude Code
  models:
    title:
      en: Which models Claude Code uses
      ru: Какие модели использует Claude Code
    explanation:
      en: >-
        `opus`, `sonnet` and `haiku` are aliases, and Claude Code decides for
        itself which release each one means — a new one arrives and your sessions
        move onto it. Point an alias at a particular release to stay where you
        are: `/model opus` keeps working and lands on what you chose here.
      ru: >-
        `opus`, `sonnet` и `haiku` — это алиасы, и Claude Code сам решает, какой
        релиз стоит за каждым: выходит новый — сессии переезжают на него.
        Направьте алиас на конкретный релиз, чтобы остаться там, где вам удобно:
        `/model opus` продолжит работать и приведёт туда, что выбрано здесь.
    slot:
      default:
        en: Session model
        ru: Модель сессии
      opus:
        en: The `opus` alias
        ru: Алиас `opus`
      sonnet:
        en: The `sonnet` alias
        ru: Алиас `sonnet`
      haiku:
        en: The `haiku` alias
        ru: Алиас `haiku`
      subagent:
        en: Subagents
        ru: Сабагенты
    hint:
      default:
        en: What a session starts on, until `/model` changes it.
        ru: С чего начинается сессия, пока её не переключили через `/model`.
      opus:
        en: Which release `opus` and `opusplan` resolve to.
        ru: В какой релиз разворачиваются `opus` и `opusplan`.
      sonnet:
        en: Which release `sonnet` resolves to.
        ru: В какой релиз разворачивается `sonnet`.
      haiku:
        en: >-
          Which release `haiku` resolves to. Claude Code also uses it for its own
          background work.
        ru: >-
          В какой релиз разворачивается `haiku`. Claude Code использует его и для
          своей фоновой работы.
      subagent:
        en: What subagents run on, whatever the session itself uses.
        ru: На чём работают сабагенты, независимо от модели самой сессии.
    unset:
      en: not set
      ru: не задано
    pick:
      en: from the list…
      ru: из списка…
    writes_key:
      en: "writes %{key}"
      ru: "пишет %{key}"
    on_disk:
      en: "in the file: %{value}"
      ru: "в файле: %{value}"
    pending:
      # Covers both directions: an edit that has not been applied, and a file
      # that changed under a window nobody has touched.
      en: Not applied yet — the file holds something else.
      ru: Ещё не применено — в файле другое.
    nothing_set:
      en: Nothing is overridden — Claude Code picks the models itself.
      ru: Ничего не переопределено — модели выбирает сам Claude Code.
    suffix_note:
      en: >-
        Any name Claude Code accepts will do, so the list is a shortcut rather
        than a limit. Adding `[1m]` asks for the 1M-token context of a model that
        has one — `claude-opus-5[1m]`.
      ru: >-
        Подойдёт любое имя, которое принимает Claude Code, — список лишь
        подсказка, а не ограничение. Суффикс `[1m]` просит миллионный контекст у
        модели, у которой он есть: `claude-opus-5[1m]`.
    availability_note:
      en: >-
        Which models your plan may run is known only to Claude Code, so nothing
        here is verified: a name it does not accept shows up as a session that
        refuses to start. If that happens, clear the field and try another.
      ru: >-
        Какие модели доступны вашей подписке, знает только Claude Code, поэтому
        здесь ничего не проверяется: имя, которое он не принимает, проявится
        сессией, отказавшейся запускаться. Если так вышло — очистите поле и
        попробуйте другое.
    precedence_note:
      en: >-
        This writes your own settings, `~/.claude/settings.json`. A project's
        `.claude/settings.json`, a `--model` flag and `/model` inside a session
        all win over it, so what is shown here is what is set, not necessarily
        what a given session ends up using.
      ru: >-
        Здесь пишутся ваши личные настройки, `~/.claude/settings.json`. Проектный
        `.claude/settings.json`, флаг `--model` и `/model` внутри сессии главнее,
        так что показанное здесь — это то, что задано, а не обязательно то, на
        чём в итоге работает конкретная сессия.
    restart_note:
      en: >-
        Claude Code reads the settings when a session starts: running sessions and
        the status line keep reporting the old model until they are restarted.
      ru: >-
        Claude Code читает настройки при старте сессии: уже запущенные сессии и
        статусная строка будут показывать старую модель, пока их не перезапустят.
    apply:
      en: Apply
      ru: Применить
    clear:
      en: Remove all overrides
      ru: Убрать все переопределения
    clear_hint:
      en: >-
        Removes every key on this page from settings.json, leaving the rest of
        the file — and the hook — as it is. Claude Code goes back to choosing the
        models itself.
      ru: >-
        Уберёт из settings.json все ключи с этой страницы, не тронув остальное в
        файле и хук. Claude Code снова будет выбирать модели сам.
    clear_confirm:
      en: Remove all model overrides?
      ru: Убрать все переопределения моделей?
    applied:
      en: "Written to %{path}"
      ru: "Записано в %{path}"
    cleared:
      en: Model overrides removed
      ru: Переопределения моделей убраны
    warn:
      environment:
        en: >-
          %{name} is also set in this program's environment (%{value}). Whichever
          value a session gets then depends on how Claude Code was started —
          remove one of the two.
        ru: >-
          %{name} задана и в окружении этой программы (%{value}). Какое значение
          достанется сессии, зависит от того, как запускали Claude Code, —
          уберите одно из двух.
      duplicate:
        en: >-
          settings.json also sets ANTHROPIC_MODEL (%{value}), which names the
          session model just like the field above. Keep one of them.
        ru: >-
          В settings.json задана ещё и ANTHROPIC_MODEL (%{value}) — она задаёт
          модель сессии так же, как поле выше. Оставьте что-то одно.
      legacy:
        en: >-
          settings.json still carries %{name} (%{value}), the old name of the
          Haiku override. Use the field above instead.
        ru: >-
          В settings.json остался %{name} (%{value}) — прежнее имя настройки для
          Haiku. Пользуйтесь полем выше.
      unknown:
        en: >-
          "%{value}" (%{slot}) is not a model this version knows about. That may
          be fine — new ones appear faster than releases of this program — but
          check it for a typo.
        ru: >-
          «%{value}» (%{slot}) — модель, о которой эта версия не знает. Возможно,
          всё в порядке: новые появляются быстрее, чем обновления этой программы.
          Но проверьте, нет ли опечатки.
  statusline:
    title:
      en: Status line
      ru: Статусная строка
    enabled:
      en: Print the line in Claude Code
      ru: Печатать строку в Claude Code
    colors:
      en: Colourise (ANSI)
      ru: Раскрашивать (ANSI)
    bar_width:
      en: "Bar width:"
      ru: "Ширина полос:"
    preset:
      en: "Preset:"
      ru: "Пресет:"
    preset_custom:
      en: Custom
      ru: Свой
    template:
      en: "Template:"
      ru: "Шаблон:"
    preview:
      en: "Preview:"
      ru: "Предпросмотр:"
    placeholders:
      en: Placeholders
      ru: Плейсхолдеры
  tray:
    title:
      en: Tray icon
      ru: Иконка в трее
    icon_hint:
      en: The outer ring is the 5-hour session, the inner one is today's budget.
      ru: Внешнее кольцо — пятичасовая сессия, внутреннее — норма на сегодня.
    refresh:
      en: "Refresh every:"
      ru: "Обновлять каждые:"
  update:
    title:
      en: Version
      ru: Версия
    explanation:
      en: >-
        New versions are taken from the GitHub releases and installed in place:
        the download replaces this binary where it stands, so nothing has to be
        moved or registered again afterwards. Only the check is manual —
        nothing reaches the network until the button is pressed.
      ru: >-
        Новые версии берутся из релизов на GitHub и ставятся автоматически:
        загруженный файл заменяет текущий там, где он лежит, — ничего
        перекладывать и прописывать заново не нужно. Вручную только проверка:
        до нажатия кнопки в сеть ничего не уходит.
    source:
      en: "Source and releases:"
      ru: "Исходники и релизы:"
    current:
      en: "Installed: %{version}"
      ru: "Установлена: %{version}"
    check:
      en: Check for update
      ru: Проверить обновление
    checking:
      en: Checking…
      ru: Проверяю…
    download:
      en: "Download %{version}"
      ru: "Загрузить %{version}"
    downloading:
      en: Downloading…
      ru: Загружаю…
    restart:
      en: Restart
      ru: Перезапустить
  autostart:
    title:
      en: Autostart
      ru: Автозапуск
    enabled:
      en: Start with the system
      ru: Запускать вместе с системой
    hint:
      en: >-
        Starts hidden in the tray. The hook keeps collecting samples on its own,
        but the icon, today's budget and the direct request need the application
        running.
      ru: >-
        Запускается сразу в трей, без окна. Хук собирает данные и сам по себе,
        но иконка, норма на сегодня и прямой запрос работают только при
        запущенном приложении.
    elsewhere:
      en: "The system is starting another copy: %{path}"
      ru: "Система запускает другую копию: %{path}"
    elsewhere_fix:
      en: Tick the box to point it at this one.
      ru: Поставьте галочку, чтобы указать на текущую.
    on:
      en: Autostart enabled
      ru: Автозапуск включён
    off:
      en: Autostart disabled
      ru: Автозапуск выключен
  probe:
    title:
      en: Asking Claude Code directly
      ru: Прямой запрос к Claude Code
    explanation:
      en: >-
        The status line only reaches sessions started from a terminal. When it
        goes quiet — an editor-hosted session, or a long pause — Claude Code can
        be asked for the same figures directly. It also reports the weekly cap
        of a single model, which the status line never carries.
      ru: >-
        Статусная строка доходит только до сессий, запущенных из терминала.
        Когда она замолкает — сессия внутри редактора или долгая пауза — те же
        цифры можно спросить у Claude Code напрямую. Оттуда же приходит
        недельный лимит по отдельной модели, которого в статусной строке нет.
    enabled:
      en: Ask when the status line has nothing fresh
      ru: Спрашивать, когда в статусной строке нет свежего
    interval:
      en: "No more often than:"
      ru: "Не чаще чем раз в:"
    interval_hint:
      en: >-
        A request starts a Claude Code of its own for a few seconds and a few
        hundred megabytes. It spends no tokens, but it is not free — while the
        status line keeps delivering, nothing is asked at all.
      ru: >-
        Запрос поднимает отдельный Claude Code на несколько секунд и несколько
        сотен мегабайт. Токены он не тратит, но и бесплатным не является — пока
        статусная строка присылает данные, запрос не делается вовсе.
    run_now:
      en: Ask now
      ru: Спросить сейчас
    running:
      en: Asking…
      ru: Спрашиваю…
  scan:
    title:
      en: Counting the session logs
      ru: Подсчёт по логам сессий
    hint:
      en: >-
        Tokens per model and per project are counted from the logs Claude Code
        writes for every session. It happens once a day on its own; only the
        parts of a log that grew since last time are read.
      ru: >-
        Токены по моделям и проектам считаются по логам, которые Claude Code
        пишет для каждой сессии. Это происходит раз в сутки само; читается лишь
        то, что дописалось с прошлого раза.
    run_now:
      en: Count now
      ru: Пересчитать сейчас
    last:
      en: "last counted %{time}"
      ru: "последний подсчёт %{time}"
    recount:
      en: Count again from scratch
      ru: Пересчитать всё заново
    recount_hint:
      en: >-
        Every count already reads every log; this one first forgets what was
        counted before. Days whose logs Claude Code has deleted since will be
        lost — they exist nowhere else.
      ru: >-
        Обычный подсчёт и так читает все логи; этот сначала забывает всё, что
        было учтено. Дни, логи которых Claude Code успел удалить, пропадут —
        больше их взять неоткуда.
    recount_confirm:
      en: Forget what was counted and read every log again?
      ru: Забыть посчитанное и прочитать все логи заново?
  language:
    title:
      en: Language
      ru: Язык
    auto:
      en: System
      ru: Системный
    restart_note:
      en: Applies immediately; the status line follows on its next update.
      ru: Применяется сразу; статусная строка — со следующего обновления.
  storage:
    title:
      en: Storage
      ru: Хранение
    retention:
      en: "Keep history for:"
      ru: "Хранить историю:"
    retention_hint:
      en: 0 — keep forever
      ru: 0 — не удалять
    reset:
      en: Reset statistics
      ru: Сбросить статистику
    reset_hint:
      en: >-
        Deletes the collected history. Your settings and the connection to
        Claude Code stay, and a backup copy is saved first
      ru: >-
        Удалит собранную историю. Настройки и подключение к Claude Code
        останутся, перед удалением сохранится резервная копия
    reset_confirm:
      en: Delete the collected history?
      ru: Удалить собранную историю?
    reset_yes:
      en: Delete
      ru: Удалить
    reset_no:
      en: Cancel
      ru: Отмена
    reset_done:
      en: "Deleted %{count} records. Backup: %{backup}"
      ru: "Удалено записей: %{count}. Резервная копия: %{backup}"
  save:
    en: Save settings
    ru: Сохранить настройки
  saved:
    en: Settings saved
    ru: Настройки сохранены

unit:
  seconds_suffix:
    en: " s"
    ru: " с"
  days_suffix:
    en: " d"
    ru: " дн"
