[workspace]
resolver = "3"
members = ["crates/core", "crates/hook", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# egui 0.36 and its companions require 1.95; declaring less makes `cargo add`
# silently resolve them down to an incompatible older release.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/roxblnfk/claude-status"

[workspace.dependencies]
claude-status-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
